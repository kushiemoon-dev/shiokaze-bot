name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pymysql
      - run: |
          for f in test_*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done
